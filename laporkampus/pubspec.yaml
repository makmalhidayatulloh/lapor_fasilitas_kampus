name: laporkampus
description: Aplikasi Laporan Kerusakan Fasilitas Kampus
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management sederhana
  provider: ^6.1.2

  # HTTP request ke Laravel API
  http: ^1.2.1

  # Ambil foto dari kamera
  image_picker: ^1.1.2
  camera: ^0.11.0+2

  # Permintaan izin kamera
  permission_handler: ^11.3.1

  # Simpan token login secara lokal & persisten (dipakai juga untuk dark mode)
  shared_preferences: ^2.2.3

  # Format tanggal
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Generator icon aplikasi (launcher icon) dari assets/icon/icon.png
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png

# Konfigurasi flutter_launcher_icons.
# Cara pakai: jalankan `flutter pub get` lalu
# `dart run flutter_launcher_icons` di terminal (folder laporkampus).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#3F51B5"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true